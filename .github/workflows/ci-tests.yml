# Continuous Integration - Tests
#
# This workflow runs the Python test suite to ensure code quality:
# - pytest suite (unit + regression tests) across Python 3.10-3.13
# - ruff lint as a required check
# - bandit/safety as advisory security scans
#
# Runs on:
# - Push to main branch
# - Pull requests to main
# - Manual trigger via workflow_dispatch

name: CI - Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        experimental: [false]
        include:
          - python-version: '3.14'
            experimental: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run test suite (with coverage floor)
      run: |
        python -m pytest tests/ -m "not network" \
          --cov=penguin-overlord --cov-report=term --cov-fail-under=29

    - name: Validate requirements.txt
      run: |
        pip check

  lint:
    name: Lint (required)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with Ruff
      run: |
        ruff check . --output-format=github

  security-advisory:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install scanners
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml] pip-audit
        pip install -r requirements.txt

    # High-severity findings are a required gate (currently clean);
    # the full report below stays advisory.
    - name: Bandit high-severity gate (required)
      run: |
        bandit -r penguin-overlord/ -lll

    - name: Bandit full report (advisory)
      run: |
        bandit -r penguin-overlord/ -f json -o bandit-report.json
        bandit -r penguin-overlord/
      continue-on-error: true

    - name: Check for known dependency vulnerabilities
      run: |
        pip-audit -r requirements.txt
      continue-on-error: true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: bandit-report-${{ github.sha }}
        path: bandit-report.json

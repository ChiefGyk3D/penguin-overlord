# Python Dependency Vulnerability Scanning
#
# This workflow scans Python dependencies for known vulnerabilities using:
# - pip-audit: Checks against the OSV database for known vulnerabilities
# (safety was dropped: its 'check' CLI is deprecated and now requires auth)
#
# Runs on:
# - Push to main
# - Pull requests
# - Manual trigger via workflow_dispatch
#
# Reports are uploaded as artifacts for review

name: Dependency Vulnerability Scan

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Python Dependency Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade "pip>=25.3"
        pip install -r requirements.txt
        pip install pip-audit

    - name: Run pip-audit
      run: pip-audit --format json --output pip-audit-report.json
      continue-on-error: true

    - name: Upload pip-audit report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pip-audit-report
        path: pip-audit-report.json
        retention-days: 30

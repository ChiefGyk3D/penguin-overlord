# Docker Build & Publish
# Builds and publishes multi-architecture Docker images

name: Docker Build & Publish

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set lowercase image name
      id: image-name
      run: echo "value=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.value }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build Docker image (for testing)
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      if: github.event_name == 'pull_request'
      run: |
        IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
        echo "Testing image: $IMAGE_TAG"
        # Core deps import
        docker run --rm "$IMAGE_TAG" python -c "import discord; import aiohttp; print('Imports successful')"
        # Every cog must import inside the image (catches deps missing from requirements.txt)
        docker run --rm -w /app/penguin-overlord "$IMAGE_TAG" python -c "
        import importlib, pathlib, sys
        sys.path.insert(0, '.')
        failed = []
        for p in sorted(pathlib.Path('cogs').glob('*.py')):
            if p.name.startswith('_'):
                continue
            try:
                importlib.import_module(f'cogs.{p.stem}')
            except Exception as e:
                failed.append(f'{p.stem}: {type(e).__name__}: {e}')
        if failed:
            print('Cog import failures inside image:', *failed, sep='\n')
            raise SystemExit(1)
        print('All cogs import inside the image')
        "
        # Healthcheck script must be present and exit 0 when metrics are off
        docker run --rm "$IMAGE_TAG" python scripts/healthcheck.py

    - name: Scan image with Trivy
      if: github.event_name == 'pull_request'
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
      with:
        image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
      continue-on-error: true

    - name: Upload Trivy results
      if: github.event_name == 'pull_request' && hashFiles('trivy-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

    - name: Build and push multi-platform image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        no-cache: true
        pull: true

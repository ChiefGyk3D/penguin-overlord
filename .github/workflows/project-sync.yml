# Keeps the Renegade-Penguin suite board (organization project 1) in step with
# this repository's issues and pull requests: adds each one, sets its status,
# stamps the done date on close or merge, and reconciles weekly. The job lives
# in ChiefGyk3D/git-your-ship-together; this file only says which board and
# which Area. It reads two repository variables, PROJECTS_APP_CLIENT_ID and
# PROJECTS_DOPPLER_IDENTITY_ID; the board App's private key comes from Doppler
# over OIDC (project `projects`, config `prd`), never from a GitHub secret.
#
# Until the Area option "Penguin Overlord" exists on the board and the two
# variables and the Doppler identity are set, every run of this workflow is
# red; the checklist is docs/superpowers/plans/2026-10-07-board-and-gyst-onboarding.md.
name: Project sync

on:
  issues:
    types: [opened, reopened, closed, edited]
  # zizmor: ignore[dangerous-triggers] -- no checkout, no run step, the inlined
  # script reads the event payload as JSON and never the pull request's text.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-sync-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/project-sync.yml@1360d100a45897b2d658272441bc5238d6532743 # v1.16.0
    permissions:
      contents: read
      id-token: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      project-url: https://github.com/orgs/Renegade-Penguin/projects/1
      client-id: ${{ vars.PROJECTS_APP_CLIENT_ID }}
      default-area-field: Area
      default-area: Penguin Overlord
      doppler-project: projects
      doppler-config: prd
      doppler-identity-id: ${{ vars.PROJECTS_DOPPLER_IDENTITY_ID }}
      doppler-trusted-refs-only: false   # required for pull_request_target; see the git-your-ship-together README
      egress-policy: block

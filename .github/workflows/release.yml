# Container release: build and test on every pull request; on main and on a
# version tag, publish a multi-arch (amd64 + arm64) image to GHCR, signed with
# cosign, with a syft SBOM and build provenance attached.
#
# Docker Hub publishing is off: the old workflow never published there. The
# jobs live in ChiefGyk3D/git-your-ship-together.
#
# Image: ghcr.io/chiefgyk3d/penguin-overlord
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild of `latest` from main so base-image fixes reach the
    # published image between commits. Monday 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-docker-release.yml@f6538c8277d5b02b1c8c8f817dc354c0faaa4622 # v1.2.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      dockerfile: Dockerfile
      push: ${{ github.event_name != 'pull_request' }}
      docker-test-command: |
        docker run --rm "$IMAGE" python -c "import discord; import aiohttp; print('Imports successful')"
        docker run --rm "$IMAGE" python scripts/healthcheck.py
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}

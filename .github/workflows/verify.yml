# Nightly: pull the published image, verify its signature, SBOM attestation
# and provenance against this account's identity, and run the same check the
# release ran, on both platforms. The producer signs; this proves it verifies.
name: Verify published image

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/verify-published.yml@a5b834a6e03e0bf7187eeebfa84685498d73b139 # v1.14.0
    permissions:
      contents: read  # gh attestation verify reads with the workflow's own token
      packages: read  # pull the public image from GHCR
    with:
      image: ghcr.io/chiefgyk3d/penguin-overlord:latest
      test-command: |
        docker run --rm "$IMAGE" python -c "import discord; import aiohttp; print('Imports successful')"
        docker run --rm "$IMAGE" python scripts/healthcheck.py

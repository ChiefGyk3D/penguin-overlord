# Penguin Overlord Docker Compose
# Easy Docker deployment for the bot

version: '3.8'

services:
  penguin-overlord:
    image: ghcr.io/chiefgyk3d/penguin-overlord:latest
    # For local build, uncomment the following and comment the image line:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: penguin-overlord
    restart: unless-stopped
    
    # Option 1: Use .env file (contains DISCORD_BOT_TOKEN)
    env_file:
      - .env
    
    # Option 2: Use Doppler (comment out env_file above, uncomment below)
    # environment:
    #   - DOPPLER_TOKEN=${DOPPLER_TOKEN}
    #   - DOPPLER_PROJECT=penguin-overlord
    #   - DOPPLER_CONFIG=prd
    
    # Option 3: Direct environment variable (not recommended for production)
    # environment:
    #   - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    
    volumes:
      # State data persistence (cog states, posted items tracking)
      - penguin-data:/app/data
      # Optional: Mount .env file explicitly if not using env_file
      # - ./.env:/app/.env:ro
    # Optional: Health check (meaningful when METRICS_ENABLED=true)
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Optional: Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Log rotation. Not optional: without it the json-file driver grows
    # until the disk does. 20MB x 5 keeps roughly a week of a busy server's
    # logs at ~100MB. LOG_FILE in .env adds in-process rotation instead,
    # for bare-metal runs where there is no Docker driver to do it.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

# Named volumes for data persistence
volumes:
  penguin-data:
    driver: local
